@let t = i18n.t();

<div class="picker" (click)="close()">
  <section
    #dialog
    class="picker__dialog glass-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="picker-title"
    tabindex="-1"
    (click)="$event.stopPropagation()">
    <header class="picker__head">
      <div>
        <h2 class="picker__title" id="picker-title">{{ t.pickerTitle }}</h2>
        <p class="picker__subtitle">{{ t.pickerSubtitle }}</p>
      </div>
      @if (closable()) {
        <button type="button" class="picker__close" [attr.aria-label]="t.pickerClose" [title]="t.pickerClose" (click)="close()">
          <lucide-icon [img]="closeIcon" [size]="16"></lucide-icon>
        </button>
      }
    </header>

    <ul class="picker__grid">
      @for (c of cards(); track c.id) {
        <li>
          <button type="button" class="sea" [class.sea--current]="c.current" [attr.aria-current]="c.current ? 'true' : null" (click)="choose(c.id)">
            <span class="sea__map" aria-hidden="true">
              <svg [attr.viewBox]="'-4 -4 ' + (c.thumb.w + 8) + ' ' + (c.thumb.h + 8)" preserveAspectRatio="xMidYMid meet">
                <path [attr.d]="c.thumb.d"></path>
              </svg>
            </span>
            <span class="sea__name">
              {{ c.name }}
              @if (c.current) {
                <em class="sea__now">{{ t.pickerCurrent }}</em>
              }
            </span>
            <span class="sea__stats">{{ c.stats }}</span>
            @if (c.people) {
              <span class="sea__stats">{{ c.people }}</span>
            }
          </button>
        </li>
      }
    </ul>
  </section>
</div>
