<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KMD · Baltic Watershed</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive 3D globe of the Baltic Sea drainage basin: every river catchment that drains to the Baltic, the sea sub-basins they feed and the countries they cross.">
  <meta name="theme-color" content="#f5f7fb">
  <link rel="icon" type="image/svg+xml" href="assets/design-system/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="assets/design-system/favicon.ico">

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KMD Labs">
  <meta property="og:title" content="KMD · Baltic Watershed">
  <meta property="og:description" content="Every river that ends in the Baltic Sea, its catchment and the sea it flows into.">
  <meta property="og:image" content="https://kmd-labs.github.io/watershed/assets/design-system/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KMD · Baltic Watershed">
  <meta name="twitter:description" content="Every river that ends in the Baltic Sea, its catchment and the sea it flows into.">
  <meta name="twitter:image" content="https://kmd-labs.github.io/watershed/assets/design-system/og-image.png">

  <!-- Before the first paint: the look (Midnight unless White & Classy was chosen before) and,
       for a link to a sea, that sea's data. A plain visit downloads no map data until a sea is
       picked on the entry map. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('watershed.theme') !== 'light') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1526');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      try {
        var s = new URLSearchParams(location.search).get('sea');
        if (['baltic', 'north', 'med', 'black', 'caspian'].indexOf(s) < 0) return;
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'fetch'; l.type = 'application/json'; l.crossOrigin = 'anonymous';
        l.href = 'assets/data/' + s + '.json';
        document.head.appendChild(l);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
